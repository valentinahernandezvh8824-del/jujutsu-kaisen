<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Nobara Kugisaki</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#2f1c08"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f08c00" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f08c00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="243" cy="122" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#f08c00" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#f08c00" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#f08c00" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#f08c00" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-5.9 320 300)">釘</text>

  <g opacity=".95">
    <g stroke="#f08c00" stroke-width="6" stroke-linecap="round" fill="none">
      <path d="M320 210 L320 400"/>
      <path d="M260 250 L380 250" stroke-width="10"/>
      <path d="M190 300 L240 260 M450 300 L400 260 M210 380 L255 345 M430 380 L385 345" opacity=".65"/>
    </g>
    <circle cx="320" cy="250" r="9" fill="#f08c00"/></g>
  <rect x="534" y="116" width="9.0" height="30.7" rx="1" fill="#f08c00" opacity="0.59" transform="rotate(16 534 116)"/><rect x="409" y="130" width="4.2" height="14.2" rx="1" fill="#f08c00" opacity="0.29" transform="rotate(140 409 130)"/><rect x="226" y="304" width="5.8" height="19.7" rx="1" fill="#f08c00" opacity="0.41" transform="rotate(313 226 304)"/><rect x="255" y="205" width="3.7" height="12.5" rx="1" fill="#f08c00" opacity="0.42" transform="rotate(300 255 205)"/><rect x="253" y="337" width="3.3" height="11.2" rx="1" fill="#f08c00" opacity="0.57" transform="rotate(233 253 337)"/><rect x="251" y="376" width="3.6" height="12.2" rx="1" fill="#f08c00" opacity="0.22" transform="rotate(129 251 376)"/><rect x="146" y="259" width="6.6" height="22.5" rx="1" fill="#f08c00" opacity="0.35" transform="rotate(334 146 259)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

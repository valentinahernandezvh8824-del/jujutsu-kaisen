<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Satoru Gojo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#0a242d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22b8cf" stop-opacity=".85"/>
      <stop offset="1" stop-color="#22b8cf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="371" cy="122" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#22b8cf" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#22b8cf" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#22b8cf" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#22b8cf" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-5.4 320 300)">五</text>

  <g opacity=".95">
    <g fill="none" stroke="#22b8cf">
      <circle cx="320" cy="300" r="105" stroke-width="3" opacity=".9"/>
      <circle cx="320" cy="300" r="76" stroke-width="2" stroke-dasharray="4 9" opacity=".8"/>
      <circle cx="320" cy="300" r="140" stroke-width="1.5" stroke-dasharray="18 14" opacity=".55"/>
      <circle cx="320" cy="300" r="175" stroke-width="1" opacity=".3"/>
      <circle cx="320" cy="300" r="26" fill="#22b8cf" opacity=".9" stroke="none"/>
    </g></g>
  <rect x="493" y="148" width="6.5" height="22.1" rx="1" fill="#22b8cf" opacity="0.42" transform="rotate(34 493 148)"/><rect x="495" y="307" width="5.8" height="19.8" rx="1" fill="#22b8cf" opacity="0.33" transform="rotate(244 495 307)"/><rect x="241" y="140" width="4.7" height="16.0" rx="1" fill="#22b8cf" opacity="0.57" transform="rotate(95 241 140)"/><rect x="365" y="253" width="5.3" height="17.9" rx="1" fill="#22b8cf" opacity="0.21" transform="rotate(224 365 253)"/><rect x="283" y="145" width="7.8" height="26.6" rx="1" fill="#22b8cf" opacity="0.18" transform="rotate(222 283 145)"/><rect x="485" y="294" width="6.2" height="21.1" rx="1" fill="#22b8cf" opacity="0.53" transform="rotate(298 485 294)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

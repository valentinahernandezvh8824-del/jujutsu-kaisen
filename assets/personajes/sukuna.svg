<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Ryomen Sukuna</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#280b10"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c92a2a" stop-opacity=".85"/>
      <stop offset="1" stop-color="#c92a2a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="275" cy="211" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#c92a2a" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#c92a2a" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#c92a2a" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#c92a2a" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-5.0 320 300)">宿</text>

  <g opacity=".95">
    <g stroke="none" fill="#c92a2a">
      <path d="M170 420 L400 190 L430 220 L200 450 Z" opacity=".9"/>
      <path d="M240 450 L470 220 L495 248 L265 478 Z" opacity=".65"/>
      <path d="M150 340 L330 160 L350 182 L170 362 Z" opacity=".5"/>
      <path d="M300 480 L500 280 L515 300 L315 500 Z" opacity=".38"/>
    </g></g>
  <rect x="95" y="446" width="3.5" height="11.8" rx="1" fill="#c92a2a" opacity="0.26" transform="rotate(251 95 446)"/><rect x="123" y="283" width="3.3" height="11.3" rx="1" fill="#c92a2a" opacity="0.42" transform="rotate(346 123 283)"/><rect x="212" y="451" width="4.7" height="16.0" rx="1" fill="#c92a2a" opacity="0.56" transform="rotate(165 212 451)"/><rect x="336" y="461" width="3.6" height="12.4" rx="1" fill="#c92a2a" opacity="0.45" transform="rotate(66 336 461)"/><rect x="402" y="347" width="5.6" height="19.0" rx="1" fill="#c92a2a" opacity="0.28" transform="rotate(307 402 347)"/><rect x="473" y="190" width="8.5" height="28.8" rx="1" fill="#c92a2a" opacity="0.55" transform="rotate(201 473 190)"/><rect x="245" y="354" width="3.5" height="12.0" rx="1" fill="#c92a2a" opacity="0.57" transform="rotate(101 245 354)"/><rect x="140" y="370" width="9.5" height="32.3" rx="1" fill="#c92a2a" opacity="0.41" transform="rotate(357 140 370)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

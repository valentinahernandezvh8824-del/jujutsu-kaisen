<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Panda</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#23242a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#adb5bd" stop-opacity=".85"/>
      <stop offset="1" stop-color="#adb5bd" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="422" cy="205" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#adb5bd" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-9.3 320 300)">熊</text>

  <g opacity=".95">
    <g fill="none" stroke="#adb5bd" stroke-width="3" opacity=".85">
      <path d="M320 210 L400 255 L400 345 L320 390 L240 345 L240 255 Z"/>
      <path d="M320 255 L360 278 L360 322 L320 345 L280 322 L280 278 Z" opacity=".7"/>
      <circle cx="320" cy="300" r="10" fill="#adb5bd" stroke="none"/>
    </g></g>
  <rect x="190" y="285" width="5.8" height="19.9" rx="1" fill="#adb5bd" opacity="0.22" transform="rotate(34 190 285)"/><rect x="420" y="433" width="6.1" height="20.6" rx="1" fill="#adb5bd" opacity="0.56" transform="rotate(198 420 433)"/><rect x="524" y="191" width="7.0" height="23.6" rx="1" fill="#adb5bd" opacity="0.24" transform="rotate(281 524 191)"/><rect x="511" y="392" width="9.5" height="32.3" rx="1" fill="#adb5bd" opacity="0.53" transform="rotate(277 511 392)"/><rect x="267" y="305" width="7.1" height="24.2" rx="1" fill="#adb5bd" opacity="0.20" transform="rotate(151 267 305)"/><rect x="266" y="137" width="5.8" height="19.8" rx="1" fill="#adb5bd" opacity="0.43" transform="rotate(22 266 137)"/><rect x="518" y="377" width="7.5" height="25.6" rx="1" fill="#adb5bd" opacity="0.30" transform="rotate(230 518 377)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

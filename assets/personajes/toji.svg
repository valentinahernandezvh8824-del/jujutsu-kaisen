<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Toji Fushiguro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#111218"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#495057" stop-opacity=".85"/>
      <stop offset="1" stop-color="#495057" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="250" cy="301" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#495057" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#495057" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#495057" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#495057" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-10.3 320 300)">甚</text>

  <g opacity=".95">
    <g fill="none" stroke="#495057">
      <path d="M250 480 L390 170" stroke-width="9" stroke-linecap="round" opacity=".9"/>
      <path d="M390 170 L360 200 L395 225 Z" fill="#495057" stroke="none"/>
      <path d="M245 300 L395 300" stroke-width="2" stroke-dasharray="3 7" opacity=".5"/>
      <circle cx="320" cy="300" r="62" stroke-width="2" opacity=".35"/>
    </g></g>
  <rect x="123" y="384" width="9.1" height="30.8" rx="1" fill="#495057" opacity="0.16" transform="rotate(297 123 384)"/><rect x="322" y="499" width="8.3" height="28.3" rx="1" fill="#495057" opacity="0.20" transform="rotate(213 322 499)"/><rect x="529" y="459" width="3.8" height="13.0" rx="1" fill="#495057" opacity="0.25" transform="rotate(324 529 459)"/><rect x="382" y="168" width="4.2" height="14.1" rx="1" fill="#495057" opacity="0.42" transform="rotate(192 382 168)"/><rect x="434" y="104" width="6.7" height="22.6" rx="1" fill="#495057" opacity="0.52" transform="rotate(309 434 104)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

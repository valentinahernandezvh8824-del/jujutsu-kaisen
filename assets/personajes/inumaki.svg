<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Toge Inumaki</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#1a1234"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7950f2" stop-opacity=".85"/>
      <stop offset="1" stop-color="#7950f2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="243" cy="243" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#7950f2" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#7950f2" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#7950f2" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#7950f2" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-7.4 320 300)">狗</text>

  <g opacity=".95">
    <g fill="none" stroke="#7950f2" stroke-linecap="round">
      <path d="M250 300 q35 -60 70 0 t70 0" stroke-width="6" opacity=".9"/>
      <path d="M220 340 q50 -70 100 0 t100 0" stroke-width="4" opacity=".6"/>
      <path d="M280 262 q25 -40 50 0 t50 0" stroke-width="3" opacity=".45"/>
      <path d="M195 380 q60 -84 120 0 t120 0" stroke-width="2" opacity=".3"/>
    </g></g>
  <rect x="519" y="295" width="7.6" height="26.0" rx="1" fill="#7950f2" opacity="0.59" transform="rotate(264 519 295)"/><rect x="461" y="161" width="8.2" height="27.8" rx="1" fill="#7950f2" opacity="0.33" transform="rotate(337 461 161)"/><rect x="139" y="360" width="3.3" height="11.1" rx="1" fill="#7950f2" opacity="0.28" transform="rotate(180 139 360)"/><rect x="198" y="175" width="9.9" height="33.6" rx="1" fill="#7950f2" opacity="0.28" transform="rotate(53 198 175)"/><rect x="329" y="270" width="6.4" height="21.8" rx="1" fill="#7950f2" opacity="0.35" transform="rotate(194 329 270)"/><rect x="336" y="442" width="3.2" height="10.8" rx="1" fill="#7950f2" opacity="0.44" transform="rotate(134 336 442)"/><rect x="469" y="458" width="4.5" height="15.3" rx="1" fill="#7950f2" opacity="0.19" transform="rotate(14 469 458)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

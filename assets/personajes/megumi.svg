<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Megumi Fushiguro</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#121734"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4c6ef5" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4c6ef5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="230" cy="173" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#4c6ef5" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#4c6ef5" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#4c6ef5" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#4c6ef5" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-8.0 320 300)">伏</text>

  <g opacity=".95">
    <g fill="none" stroke="#4c6ef5" stroke-width="3" opacity=".8">
      <path d="M320 200 L410 300 L320 420 L230 300 Z"/>
      <path d="M320 240 L375 300 L320 380 L265 300 Z" opacity=".6"/>
      <path d="M230 300 L140 250 M410 300 L500 250" stroke-dasharray="6 8"/>
    </g>
    <circle cx="320" cy="300" r="12" fill="#4c6ef5"/></g>
  <rect x="410" y="233" width="3.7" height="12.5" rx="1" fill="#4c6ef5" opacity="0.22" transform="rotate(337 410 233)"/><rect x="352" y="399" width="6.3" height="21.3" rx="1" fill="#4c6ef5" opacity="0.45" transform="rotate(117 352 399)"/><rect x="323" y="147" width="8.9" height="30.1" rx="1" fill="#4c6ef5" opacity="0.26" transform="rotate(24 323 147)"/><rect x="143" y="413" width="4.7" height="16.0" rx="1" fill="#4c6ef5" opacity="0.45" transform="rotate(329 143 413)"/><rect x="240" y="296" width="8.6" height="29.1" rx="1" fill="#4c6ef5" opacity="0.20" transform="rotate(218 240 296)"/><rect x="478" y="196" width="7.7" height="26.3" rx="1" fill="#4c6ef5" opacity="0.31" transform="rotate(338 478 196)"/><rect x="252" y="161" width="3.3" height="11.3" rx="1" fill="#4c6ef5" opacity="0.44" transform="rotate(243 252 161)"/><rect x="456" y="435" width="4.0" height="13.6" rx="1" fill="#4c6ef5" opacity="0.37" transform="rotate(21 456 435)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

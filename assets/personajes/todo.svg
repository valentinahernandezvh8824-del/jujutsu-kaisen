<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Aoi Todo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#2b0c1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#d6336c" stop-opacity=".85"/>
      <stop offset="1" stop-color="#d6336c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="218" cy="134" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#d6336c" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#d6336c" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#d6336c" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#d6336c" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-10.8 320 300)">東</text>

  <g opacity=".95">
    <g fill="none" stroke="#d6336c">
      <circle cx="235" cy="340" r="46" stroke-width="4" opacity=".9"/>
      <circle cx="405" cy="240" r="46" stroke-width="4" opacity=".9"/>
      <path d="M235 280 C235 200 405 190 405 240" stroke-width="2.5" stroke-dasharray="8 8" opacity=".7"/>
      <path d="M405 380 C405 460 235 470 235 340" stroke-width="2.5" stroke-dasharray="8 8" opacity=".45"/>
    </g></g>
  <rect x="330" y="276" width="4.4" height="15.0" rx="1" fill="#d6336c" opacity="0.50" transform="rotate(329 330 276)"/><rect x="439" y="282" width="9.7" height="33.1" rx="1" fill="#d6336c" opacity="0.24" transform="rotate(296 439 282)"/><rect x="298" y="99" width="6.8" height="23.2" rx="1" fill="#d6336c" opacity="0.19" transform="rotate(322 298 99)"/><rect x="259" y="488" width="9.3" height="31.5" rx="1" fill="#d6336c" opacity="0.57" transform="rotate(349 259 488)"/><rect x="441" y="497" width="6.7" height="22.8" rx="1" fill="#d6336c" opacity="0.47" transform="rotate(13 441 497)"/><rect x="432" y="340" width="6.3" height="21.6" rx="1" fill="#d6336c" opacity="0.58" transform="rotate(230 432 340)"/><rect x="543" y="488" width="9.2" height="31.4" rx="1" fill="#d6336c" opacity="0.59" transform="rotate(241 543 488)"/><rect x="453" y="487" width="9.6" height="32.5" rx="1" fill="#d6336c" opacity="0.59" transform="rotate(155 453 487)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

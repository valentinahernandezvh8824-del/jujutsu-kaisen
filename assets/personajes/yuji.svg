<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Yuji Itadori</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#2e0e15"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e63946" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="416" cy="141" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#e63946" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#e63946" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#e63946" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#e63946" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-7.2 320 300)">虎</text>

  <g opacity=".95">
    <polyline points="250,430 310,330 285,325 370,205 350,300 385,292 280,450"
      fill="none" stroke="#e63946" stroke-width="10" stroke-linejoin="round" opacity=".85"/>
    <polyline points="250,430 310,330 285,325 370,205 350,300 385,292 280,450"
      fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" opacity=".7"/></g>
  <rect x="548" y="93" width="6.2" height="21.0" rx="1" fill="#e63946" opacity="0.50" transform="rotate(73 548 93)"/><rect x="367" y="396" width="5.8" height="19.7" rx="1" fill="#e63946" opacity="0.38" transform="rotate(300 367 396)"/><rect x="229" y="250" width="6.1" height="20.9" rx="1" fill="#e63946" opacity="0.56" transform="rotate(337 229 250)"/><rect x="387" y="211" width="7.5" height="25.4" rx="1" fill="#e63946" opacity="0.50" transform="rotate(340 387 211)"/><rect x="487" y="255" width="6.2" height="20.9" rx="1" fill="#e63946" opacity="0.23" transform="rotate(53 487 255)"/><rect x="438" y="436" width="9.0" height="30.6" rx="1" fill="#e63946" opacity="0.30" transform="rotate(75 438 436)"/><rect x="130" y="494" width="3.6" height="12.4" rx="1" fill="#e63946" opacity="0.27" transform="rotate(353 130 494)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

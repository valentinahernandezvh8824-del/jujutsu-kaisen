<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Kento Nanami</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#302008"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f59f00" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f59f00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="218" cy="122" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#f59f00" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#f59f00" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#f59f00" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#f59f00" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-5.5 320 300)">七</text>

  <g opacity=".95">
    <g stroke="#f59f00" fill="none">
      <path d="M170 300 L470 300" stroke-width="3" opacity=".85"/>
      <path d="M170 235 L170 365" stroke-width="7" opacity="0.35"/><path d="M212.85714285714286 235 L212.85714285714286 365" stroke-width="7" opacity="0.43"/><path d="M255.71428571428572 235 L255.71428571428572 365" stroke-width="7" opacity="0.51"/><path d="M298.57142857142856 235 L298.57142857142856 365" stroke-width="7" opacity="0.59"/><path d="M341.42857142857144 235 L341.42857142857144 365" stroke-width="7" opacity="0.67"/><path d="M384.2857142857143 235 L384.2857142857143 365" stroke-width="7" opacity="0.75"/><path d="M427.1428571428571 235 L427.1428571428571 365" stroke-width="7" opacity="0.83"/>
      <path d="M170 300 L300 300" stroke-width="6" opacity=".9"/>
    </g></g>
  <rect x="249" y="280" width="5.0" height="16.9" rx="1" fill="#f59f00" opacity="0.45" transform="rotate(339 249 280)"/><rect x="405" y="286" width="5.1" height="17.5" rx="1" fill="#f59f00" opacity="0.50" transform="rotate(134 405 286)"/><rect x="485" y="174" width="5.2" height="17.6" rx="1" fill="#f59f00" opacity="0.37" transform="rotate(145 485 174)"/><rect x="420" y="305" width="3.6" height="12.2" rx="1" fill="#f59f00" opacity="0.49" transform="rotate(358 420 305)"/><rect x="465" y="400" width="3.0" height="10.3" rx="1" fill="#f59f00" opacity="0.44" transform="rotate(238 465 400)"/>

  <rect width="640" height="640" fill="url(#vig)"/>

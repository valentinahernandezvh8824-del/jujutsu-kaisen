<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Maki Zenin</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#0d2014"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2f9e44" stop-opacity=".85"/>
      <stop offset="1" stop-color="#2f9e44" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="294" cy="198" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#2f9e44" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#2f9e44" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#2f9e44" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#2f9e44" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-8.6 320 300)">禪</text>

  <g opacity=".95">
    <g fill="none" stroke="#2f9e44" stroke-linecap="round">
      <path d="M170 470 L470 170" stroke-width="7" opacity=".9"/>
      <path d="M470 170 L440 190 L455 210 Z" fill="#2f9e44" stroke="none"/>
      <path d="M200 500 L440 260" stroke-width="2" opacity=".45"/>
      <path d="M150 440 L410 180" stroke-width="2" opacity=".3"/>
    </g></g>
  <rect x="461" y="481" width="7.0" height="23.7" rx="1" fill="#2f9e44" opacity="0.33" transform="rotate(351 461 481)"/><rect x="207" y="392" width="7.3" height="24.8" rx="1" fill="#2f9e44" opacity="0.43" transform="rotate(353 207 392)"/><rect x="130" y="241" width="5.8" height="19.7" rx="1" fill="#2f9e44" opacity="0.33" transform="rotate(334 130 241)"/><rect x="166" y="411" width="8.4" height="28.4" rx="1" fill="#2f9e44" opacity="0.34" transform="rotate(67 166 411)"/><rect x="333" y="483" width="4.6" height="15.8" rx="1" fill="#2f9e44" opacity="0.19" transform="rotate(69 333 483)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

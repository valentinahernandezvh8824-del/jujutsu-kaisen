<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Yuta Okkotsu</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#2f1523"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f06595" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f06595" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="314" cy="128" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#f06595" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#f06595" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#f06595" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#f06595" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-10.1 320 300)">乙</text>

  <g opacity=".95">
    <g fill="none" stroke="#f06595">
      <ellipse cx="320" cy="300" rx="150" ry="58" stroke-width="3" opacity=".85"/>
      <ellipse cx="320" cy="300" rx="150" ry="58" stroke-width="1.5" transform="rotate(60 320 300)" opacity=".5"/>
      <ellipse cx="320" cy="300" rx="150" ry="58" stroke-width="1.5" transform="rotate(-60 320 300)" opacity=".5"/>
      <circle cx="320" cy="300" r="20" fill="#f06595" stroke="none" opacity=".85"/>
    </g></g>
  <rect x="395" y="370" width="4.6" height="15.8" rx="1" fill="#f06595" opacity="0.51" transform="rotate(209 395 370)"/><rect x="165" y="360" width="4.9" height="16.6" rx="1" fill="#f06595" opacity="0.43" transform="rotate(351 165 360)"/><rect x="322" y="443" width="9.0" height="30.6" rx="1" fill="#f06595" opacity="0.37" transform="rotate(285 322 443)"/><rect x="384" y="186" width="4.2" height="14.4" rx="1" fill="#f06595" opacity="0.27" transform="rotate(251 384 186)"/><rect x="231" y="213" width="5.3" height="18.1" rx="1" fill="#f06595" opacity="0.28" transform="rotate(335 231 213)"/><rect x="168" y="355" width="8.4" height="28.5" rx="1" fill="#f06595" opacity="0.40" transform="rotate(325 168 355)"/><rect x="389" y="341" width="5.5" height="18.8" rx="1" fill="#f06595" opacity="0.22" transform="rotate(332 389 341)"/><rect x="416" y="297" width="5.2" height="17.6" rx="1" fill="#f06595" opacity="0.24" transform="rotate(271 416 297)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

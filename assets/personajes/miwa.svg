<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Kasumi Miwa</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#122235"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4dabf7" stop-opacity=".85"/>
      <stop offset="1" stop-color="#4dabf7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="301" cy="237" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#4dabf7" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-11.1 320 300)">三</text>

  <g opacity=".95">
    <g fill="none" stroke="#4dabf7">
      <circle cx="320" cy="300" r="120" stroke-width="3" opacity=".85"/>
      <rect x="248" y="228" width="144" height="144" stroke-width="2" opacity=".6" transform="rotate(45 320 300)"/>
      <circle cx="320" cy="300" r="6" fill="#4dabf7" stroke="none"/>
      <path d="M320 180 L320 130 M320 420 L320 470" stroke-width="3" opacity=".5"/>
    </g></g>
  <rect x="545" y="132" width="7.6" height="25.9" rx="1" fill="#4dabf7" opacity="0.27" transform="rotate(16 545 132)"/><rect x="204" y="290" width="6.6" height="22.3" rx="1" fill="#4dabf7" opacity="0.37" transform="rotate(37 204 290)"/><rect x="478" y="500" width="5.1" height="17.4" rx="1" fill="#4dabf7" opacity="0.21" transform="rotate(254 478 500)"/><rect x="404" y="420" width="9.1" height="31.0" rx="1" fill="#4dabf7" opacity="0.23" transform="rotate(293 404 420)"/><rect x="174" y="344" width="6.5" height="22.1" rx="1" fill="#4dabf7" opacity="0.44" transform="rotate(157 174 344)"/><rect x="194" y="495" width="4.0" height="13.6" rx="1" fill="#4dabf7" opacity="0.30" transform="rotate(141 194 495)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>

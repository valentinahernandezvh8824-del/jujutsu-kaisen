<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Choso</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#2c0c11"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e03131" stop-opacity=".85"/>
      <stop offset="1" stop-color="#e03131" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="211" cy="211" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#e03131" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#e03131" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#e03131" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#e03131" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-7.1 320 300)">脹</text>

  <g opacity=".95">
    <g fill="#e03131">
      <path d="M320 190 C320 190 260 280 260 320 A60 60 0 0 0 380 320 C380 280 320 190 320 190 Z" opacity=".8"/>
      <path d="M230 250 C230 250 205 295 205 315 A25 25 0 0 0 255 315 C255 295 230 250 230 250 Z" opacity=".55"/>
      <path d="M410 250 C410 250 385 295 385 315 A25 25 0 0 0 435 315 C435 295 410 250 410 250 Z" opacity=".55"/>
      <path d="M180 60 L300 60" stroke="#e03131" stroke-width="3" opacity=".4"/>
    </g></g>
  <rect x="220" y="362" width="7.5" height="25.5" rx="1" fill="#e03131" opacity="0.17" transform="rotate(21 220 362)"/><rect x="167" y="431" width="3.2" height="11.0" rx="1" fill="#e03131" opacity="0.27" transform="rotate(357 167 431)"/><rect x="120" y="123" width="3.3" height="11.1" rx="1" fill="#e03131" opacity="0.36" transform="rotate(225 120 123)"/><rect x="534" y="206" width="7.9" height="26.8" rx="1" fill="#e03131" opacity="0.16" transform="rotate(34 534 206)"/><rect x="307" y="226" width="7.3" height="24.7" rx="1" fill="#e03131" opacity="0.22" transform="rotate(305 307 226)"/><rect x="380" y="301" width="7.6" height="25.9" rx="1" fill="#e03131" opacity="0.37" transform="rotate(157 380 301)"/><rect x="541" y="111" width="5.5" height="18.8" rx="1" fill="#e03131" opacity="0.27" transform="rotate(304 541 111)"/>

  <rect width="640" height="640" fill="url(#vig)"/>

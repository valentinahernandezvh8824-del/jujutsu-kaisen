<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" width="640" height="640" role="img" aria-labelledby="t">
  <title id="t">Arte de energía maldita de Yuki Tsukumo</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0812"/>
      <stop offset="1" stop-color="#311b27"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f783ac" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f783ac" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="45%" r="70%">
      <stop offset=".45" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#030209" stop-opacity=".92"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>

  <rect width="640" height="640" fill="url(#bg)"/>
  <circle cx="435" cy="141" r="300" fill="url(#glow)" opacity=".45" filter="url(#soft)"/>

  <g opacity=".5">
    <circle cx="320" cy="300" r="190" fill="none" stroke="#f783ac" stroke-width="1" stroke-dasharray="26 18" opacity="0.50" transform="rotate(0 320 300)"/>
    <circle cx="320" cy="300" r="236" fill="none" stroke="#f783ac" stroke-width="1" stroke-dasharray="2 12" opacity="0.40" transform="rotate(17 320 300)"/>
    <circle cx="320" cy="300" r="282" fill="none" stroke="#f783ac" stroke-width="1" stroke-dasharray="26 18" opacity="0.30" transform="rotate(34 320 300)"/>
    <circle cx="320" cy="300" r="328" fill="none" stroke="#f783ac" stroke-width="1" stroke-dasharray="2 12" opacity="0.20" transform="rotate(51 320 300)"/>
  </g>

  <path d="M-60 700 L700 -60 L760 20 L0 780 Z" fill="#ffffff" opacity=".025"/>

  <text x="320" y="440" text-anchor="middle" font-family="'Yu Mincho','Hiragino Mincho ProN','Noto Serif JP','MS Mincho',serif"
        font-size="400" font-weight="700" fill="#ffffff" opacity=".08" transform="rotate(-4.1 320 300)">九</text>

  <g opacity=".95">
      <polygon points="320.0,160.0 352.9,254.7 453.1,256.7 373.3,317.3 402.3,413.3 320.0,356.0 237.7,413.3 266.7,317.3 186.9,256.7 287.1,254.7" fill="none" stroke="#f783ac" stroke-width="3" opacity=".8"/>
      <circle cx="320" cy="300" r="24" fill="#f783ac" opacity=".8"/>
      <circle cx="320" cy="300" r="150" fill="none" stroke="#f783ac" stroke-width="1" stroke-dasharray="2 10" opacity=".4"/></g>
  <rect x="282" y="490" width="7.9" height="27.0" rx="1" fill="#f783ac" opacity="0.49" transform="rotate(221 282 490)"/><rect x="177" y="362" width="3.2" height="10.9" rx="1" fill="#f783ac" opacity="0.35" transform="rotate(286 177 362)"/><rect x="91" y="132" width="9.3" height="31.8" rx="1" fill="#f783ac" opacity="0.28" transform="rotate(2 91 132)"/><rect x="154" y="291" width="5.9" height="20.0" rx="1" fill="#f783ac" opacity="0.57" transform="rotate(123 154 291)"/><rect x="145" y="91" width="9.9" height="33.6" rx="1" fill="#f783ac" opacity="0.39" transform="rotate(37 145 91)"/><rect x="212" y="100" width="8.5" height="29.0" rx="1" fill="#f783ac" opacity="0.46" transform="rotate(340 212 100)"/><rect x="209" y="489" width="6.1" height="20.8" rx="1" fill="#f783ac" opacity="0.53" transform="rotate(205 209 489)"/><rect x="102" y="357" width="7.6" height="25.8" rx="1" fill="#f783ac" opacity="0.38" transform="rotate(9 102 357)"/>

  <rect width="640" height="640" fill="url(#vig)"/>
  <rect width="640" height="640" filter="url(#grain)" opacity=".06" style="mix-blend-mode:overlay"/>
</svg>
